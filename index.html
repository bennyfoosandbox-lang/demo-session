<title>Research Digests</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#1a1d24;--muted:#5b6270;--line:#e5e8ee;--accent:#2f6df6;}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#161b23;--ink:#e8ebf1;--muted:#9aa3b2;--line:#242c38;--accent:#6ea0ff;}}
  :root[data-theme="light"]{--bg:#f7f8fa;--card:#fff;--ink:#1a1d24;--muted:#5b6270;--line:#e5e8ee;}
  :root[data-theme="dark"]{--bg:#0f1319;--card:#161b23;--ink:#e8ebf1;--muted:#9aa3b2;--line:#242c38;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px;}
  .eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px;}
  h1{font-size:30px;margin:0 0 6px;}
  .sub{color:var(--muted);font-size:15px;margin:0 0 28px;}
  .grid{display:grid;gap:12px;}
  a.topic{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:18px 20px;transition:border-color .15s,transform .15s;}
  a.topic:hover{border-color:var(--accent);transform:translateY(-1px);}
  a.topic h2{font-size:19px;margin:0 0 4px;color:var(--accent);}
  a.topic .meta{color:var(--muted);font-size:13px;margin:0;}
  footer{margin-top:32px;color:var(--muted);font-size:13px;}
</style>
<div class="wrap">
